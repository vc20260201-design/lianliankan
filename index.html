<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102028" />
    <title>连连看</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
    </div>

    <main class="app">
      <section class="screen screen-home" id="home-screen">
        <p class="eyebrow">经典消除</p>
        <h1 class="title">连连看</h1>
        <p class="subtitle" id="mode-desc">练习模式不计时，可按自己的节奏连线</p>

        <div class="picker">
          <p class="picker-label">游戏模式</p>
          <div class="mode-toggle" role="radiogroup" aria-label="游戏模式">
            <button class="mode-btn is-active" data-mode="practice" type="button">
              <strong>练习模式</strong>
              <span>没有时钟</span>
            </button>
            <button class="mode-btn" data-mode="score" type="button">
              <strong>积分模式</strong>
              <span>统一 10 分钟</span>
            </button>
          </div>
        </div>

        <div class="picker">
          <p class="picker-label">棋盘布局</p>
          <div class="layout-grid" role="radiogroup" aria-label="棋盘布局">
            <button class="layout-btn is-active" data-layout="6x8" type="button">
              <strong>6 × 8</strong>
              <span>48 个</span>
            </button>
            <button class="layout-btn" data-layout="8x10" type="button">
              <strong>8 × 10</strong>
              <span>80 个</span>
            </button>
            <button class="layout-btn" data-layout="8x12" type="button">
              <strong>8 × 12</strong>
              <span>96 个</span>
            </button>
            <button class="layout-btn" data-layout="8x20" type="button">
              <strong>8 × 20</strong>
              <span>160 个</span>
            </button>
            <button class="layout-btn" data-layout="10x20" type="button">
              <strong>10 × 20</strong>
              <span>200 个</span>
            </button>
          </div>
        </div>

        <button class="btn btn-primary" id="start-btn" type="button">开始游戏</button>
        <p class="hint-text">点击两块相同图案，连线最多拐两个弯。每局随机一种重力和一套图标，显示在画面上方</p>
      </section>

      <section class="screen screen-game is-hidden" id="game-screen">
        <div class="topbar">
          <div class="gravity-bar" id="gravity-bar" aria-live="polite">
            <span class="set-chip" id="set-name">水果</span>
            <span class="gravity-kicker">重力</span>
            <strong class="gravity-name" id="gravity-name">向下</strong>
            <span class="gravity-mark" id="gravity-mark" aria-hidden="true">↓</span>
            <span class="gravity-hint" id="gravity-hint">消除后，悬空方块向下落</span>
          </div>
          <header class="hud">
          <div class="stat">
            <span class="stat-label">分数</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat stat-time">
            <span class="stat-label">时间</span>
            <strong id="time">10:00</strong>
            <div class="time-bar" aria-hidden="true">
              <i id="time-bar"></i>
            </div>
          </div>
          <div class="stat">
            <span class="stat-label">剩余</span>
            <strong id="remain">0</strong>
          </div>
        </header>
        </div>

        <div class="board-stage" id="board-stage">
          <svg class="path-svg" id="path-svg" aria-hidden="true"></svg>
          <div class="board" id="board"></div>
          <div class="combo-pop" id="combo-pop"></div>
        </div>

        <footer class="controls">
          <button class="btn btn-ghost" id="hint-btn" type="button">提示 <em id="hint-count">3</em></button>
          <button class="btn btn-ghost" id="shuffle-btn" type="button">重排 <em id="shuffle-count">2</em></button>
          <button class="btn btn-ghost" id="pause-btn" type="button">暂停</button>
          <button class="btn btn-ghost" id="mute-btn" type="button">音效</button>
        </footer>
      </section>
    </main>

    <div class="overlay is-hidden" id="overlay">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <p class="modal-kicker" id="modal-kicker"></p>
        <h2 id="modal-title"></h2>
        <p class="modal-body" id="modal-body"></p>
        <div class="modal-actions">
          <button class="btn btn-primary" id="modal-primary" type="button">继续</button>
          <button class="btn btn-ghost" id="modal-secondary" type="button">返回首页</button>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
